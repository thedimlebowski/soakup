# Render Blueprint — deploys the SoakUp app.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: soakup
    runtime: node
    plan: free
    region: frankfurt # Europe-centric region
    branch: main
    autoDeploy: true
    buildCommand: "npm install && npm run build"
    startCommand: "node server/server.cjs"
    envVars:
      - key: NODE_VERSION
        value: "22.22.3"
      - key: PORT
        value: "3001"
